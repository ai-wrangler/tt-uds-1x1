# Tiny Tapeout project information
project:
  title:        "UDS-1x1 drum synthesizer"      # Project title
  author:       "Juris Vitols"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Three-voice drum synth after the Soviet Formanta UDS, played over SPI or pin triggers"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     9000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ai_wrangler_uds1x1"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "uds_spi.v"
    - "uds_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "TRIG_SNARE"
  ui[1]: "TRIG_SMALL_TOM"
  ui[2]: "TRIG_MID_TOM"
  ui[3]: "TRIG_BIG_TOM"
  ui[4]: "TRIG_BASS_DRUM"
  ui[5]: "TRIG_CYMBAL"
  ui[6]: "TRIG_HIHAT_CLOSED"
  ui[7]: "TRIG_HIHAT_OPEN"

  # Outputs
  uo[0]: "SEG_A snare"
  uo[1]: "SEG_B small tom"
  uo[2]: "SEG_C mid tom"
  uo[3]: "SEG_D big tom"
  uo[4]: "SEG_E bass drum"
  uo[5]: "SEG_F cymbal"
  uo[6]: "SEG_G hi-hat"
  uo[7]: "AUDIO"

  # Bidirectional pins
  uio[0]: "SPI_CS_N"
  uio[1]: "SPI_MOSI"
  uio[2]: "SPI_MISO"
  uio[3]: "SPI_SCK"
  uio[4]: "FRAME"
  uio[5]: "BUSY"
  uio[6]: "AUDIO_L"
  uio[7]: "AUDIO_R"

# Do not change!
yaml_version: 6
